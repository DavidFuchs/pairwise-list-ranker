services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # The Apple Music storefront looked up first. Compiled into the bundle.
        EXPO_PUBLIC_APPLE_MUSIC_REGION: ${APPLE_MUSIC_REGION:-CA}
    image: pairwise-list-ranker-web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
