<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Pairwise List Ranker">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F0F2"/>
    </linearGradient>
    <radialGradient id="washA" cx="0.22" cy="-0.05" r="0.85">
      <stop offset="0" stop-color="#45D124" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#45D124" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washB" cx="0.85" cy="-0.10" r="0.80">
      <stop offset="0" stop-color="#A6D608" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#A6D608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3D5D9"/>
      <stop offset="1" stop-color="#BFC1C6"/>
    </linearGradient>
    <linearGradient id="winner" x1="0.05" y1="0" x2="0.78" y2="1">
      <stop offset="0" stop-color="#45D124"/>
      <stop offset="1" stop-color="#7BDE1A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="rest" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#101114" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#101114" flood-opacity="0.13"/>
    </filter>
    <filter id="lift" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#101114" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="46" stdDeviation="32" flood-color="#2FA318" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <rect width="1024" height="1024" fill="url(#washA)"/>
  <rect width="1024" height="1024" fill="url(#washB)"/>

  <g filter="url(#rest)"><rect x="189" y="401" width="278" height="354" rx="54" fill="url(#loser)"/></g>
  <rect x="189" y="401" width="278" height="354" rx="54" fill="url(#sheen)"/>
  <g filter="url(#lift)"><rect x="557" y="269" width="278" height="439" rx="54" fill="url(#winner)"/></g>
  <rect x="557" y="269" width="278" height="439" rx="54" fill="url(#sheen)"/>
</svg>
